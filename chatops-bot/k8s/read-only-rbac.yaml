apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-readonly
  namespace: insighthub-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops-readonly
  namespace: insighthub-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops-readonly
  namespace: insighthub-dev
subjects:
  - kind: ServiceAccount
    name: chatops-readonly
    namespace: insighthub-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatops-readonly
