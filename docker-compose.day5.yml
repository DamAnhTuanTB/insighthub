services:
  redis:
    ports:
      - "127.0.0.1:${CHATOPS_REDIS_PORT:-6379}:6379"

  chatops-bot:
    build: ./chatops-bot
    profiles: ["chatops"]
    environment:
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      CHATOPS_REDIS_URL: redis://redis:6379/1
      CHATOPS_QUEUE_MODE: redis
      CHATOPS_TOOL_MODE: fixture
      CHATOPS_NAMESPACE: ${CHATOPS_NAMESPACE:-insighthub-dev}
      CHATOPS_AUDIT_LOG: /tmp/chatops-audit.log
    ports:
      - "127.0.0.1:${CHATOPS_PORT:-8080}:8080"
    depends_on:
      redis: {condition: service_healthy}
    mem_limit: 256m

  chatops-worker:
    build: ./chatops-bot
    profiles: ["chatops"]
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      CHATOPS_REDIS_URL: redis://redis:6379/1
      CHATOPS_QUEUE_MODE: redis
      CHATOPS_TOOL_MODE: fixture
      CHATOPS_NAMESPACE: ${CHATOPS_NAMESPACE:-insighthub-dev}
      CHATOPS_AUDIT_LOG: /tmp/chatops-audit.log
    depends_on:
      redis: {condition: service_healthy}
    mem_limit: 256m
