apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: insighthub-postgres
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    insighthub.dev/environment: "local"
    app.kubernetes.io/component: postgres
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned official pgvector image uses the postgres UID 999; the pod remains non-root and drops all capabilities.
spec:
  serviceName: insighthub-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insighthub
      app.kubernetes.io/instance: insighthub
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insighthub
        app.kubernetes.io/instance: insighthub
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "insighthub"
            - name: POSTGRES_USER
              value: "insighthub"
            - name: POSTGRES_PASSWORD_FILE
              value: /run/insighthub-secrets/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 750m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-init
          configMap:
            name: db-init
        - name: runtime-secrets
          secret:
            secretName: runtime
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD

