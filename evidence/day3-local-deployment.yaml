apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-worker
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    insighthub.dev/environment: "local"
    app.kubernetes.io/component: worker
  annotations:
    checkov.io/skip1: CKV_K8S_15=Local images are loaded into the cluster node and must not be pulled from a registry.
    checkov.io/skip2: CKV_K8S_43=The local-only image has no registry digest; release profiles must replace it with a digest.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insighthub
      app.kubernetes.io/instance: insighthub
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insighthub
        app.kubernetes.io/instance: insighthub
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: insighthub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "insighthub-worker:local"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: settings
          env:
            - name: TMPDIR
              value: /tmp
          command: ["sh", "-ec"]
          args:
            - |
              export DATABASE_URL="$(cat /run/insighthub-secrets/DATABASE_URL)"
              export REDIS_URL="$(cat /run/insighthub-secrets/REDIS_URL)"
              until python -c 'import os, socket; from urllib.parse import urlparse; target = urlparse(os.environ["REDIS_URL"]); socket.create_connection((target.hostname, target.port or 6379), timeout=1).close()'; do
                sleep 1
              done
              exec arq --custom-log-dict worker.LOGGING_CONFIG worker.WorkerSettings
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - export REDIS_URL="$(cat /run/insighthub-secrets/REDIS_URL)"; exec arq --check worker.WorkerSettings
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - export REDIS_URL="$(cat /run/insighthub-secrets/REDIS_URL)"; exec arq --check worker.WorkerSettings
            initialDelaySeconds: 8
            periodSeconds: 8
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: runtime-secrets
          secret:
            secretName: runtime
            defaultMode: 0440
            items:
              - key: DATABASE_URL
                path: DATABASE_URL
              - key: REDIS_URL
                path: REDIS_URL

