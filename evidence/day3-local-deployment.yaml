apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: insighthub-redis
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    insighthub.dev/environment: "local"
    app.kubernetes.io/component: redis
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned official Redis image uses UID 999; the pod remains non-root and drops all capabilities.
spec:
  serviceName: insighthub-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insighthub
      app.kubernetes.io/instance: insighthub
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insighthub
        app.kubernetes.io/instance: insighthub
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              REDIS_PASSWORD=$(cat /run/insighthub-secrets/REDIS_PASSWORD)
              printf 'appendonly yes\nmaxmemory 128mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=$(cat /run/insighthub-secrets/REDIS_PASSWORD) redis-cli ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=$(cat /run/insighthub-secrets/REDIS_PASSWORD) redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 300m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: runtime-secrets
          secret:
            secretName: runtime
            defaultMode: 0440
            items:
              - key: REDIS_PASSWORD
                path: REDIS_PASSWORD
