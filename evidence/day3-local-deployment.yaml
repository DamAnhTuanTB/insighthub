# Source: insighthub/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-api
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    insighthub.dev/environment: "local"
    app.kubernetes.io/component: api
  annotations:
    checkov.io/skip1: CKV_K8S_15=Local images are loaded into the cluster node and must not be pulled from a registry.
    checkov.io/skip2: CKV_K8S_43=The local-only image has no registry digest; release profiles must replace it with a digest.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insighthub
      app.kubernetes.io/instance: insighthub
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insighthub
        app.kubernetes.io/instance: insighthub
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: insighthub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "insighthub-api:local"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: settings
          env:
            - name: TMPDIR
              value: /tmp
          command: ["sh", "-ec"]
          args:
            - |
              export DATABASE_URL="$(cat /run/insighthub-secrets/DATABASE_URL)"
              export REDIS_URL="$(cat /run/insighthub-secrets/REDIS_URL)"
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: runtime-secrets
          secret:
            secretName: runtime
            defaultMode: 0440
            items:
              - key: DATABASE_URL
                path: DATABASE_URL
              - key: REDIS_URL
                path: REDIS_URL

