{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insighthub.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ include "insighthub.fullname" . }}-api
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: {{ include "insighthub.fullname" . }}-api
                port:
                  name: http
          - path: /documents
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.fullname" . }}-api
                port:
                  name: http
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.fullname" . }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.fullname" . }}-web
                port:
                  name: http
{{- end }}
