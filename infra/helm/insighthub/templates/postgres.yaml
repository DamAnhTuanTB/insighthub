{{- if .Values.localDependencies.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned official pgvector image uses the postgres UID 999; the pod remains non-root and drops all capabilities.
spec:
  serviceName: {{ include "insighthub.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.localDependencies.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ .Values.localDependencies.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.localDependencies.postgres.user | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/insighthub-secrets/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.localDependencies.postgres.user | quote }}, "-d", {{ .Values.localDependencies.postgres.database | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.localDependencies.postgres.user | quote }}, "-d", {{ .Values.localDependencies.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.localDependencies.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-init
          configMap:
            name: {{ .Values.localDependencies.databaseInitConfigMap }}
        - name: runtime-secrets
          secret:
            secretName: {{ .Values.runtime.existingSecret }}
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
{{- end }}
