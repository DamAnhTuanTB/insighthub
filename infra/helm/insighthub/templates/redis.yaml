{{- if .Values.localDependencies.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "insighthub.fullname" . }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned official Redis image uses UID 999; the pod remains non-root and drops all capabilities.
spec:
  serviceName: {{ include "insighthub.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.localDependencies.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              REDIS_PASSWORD=$(cat /run/insighthub-secrets/REDIS_PASSWORD)
              printf 'appendonly yes\nmaxmemory 128mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=$(cat /run/insighthub-secrets/REDIS_PASSWORD) redis-cli ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=$(cat /run/insighthub-secrets/REDIS_PASSWORD) redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.localDependencies.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/insighthub-secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: runtime-secrets
          secret:
            secretName: {{ .Values.runtime.existingSecret }}
            defaultMode: 0440
            items:
              - key: REDIS_PASSWORD
                path: REDIS_PASSWORD
{{- end }}
