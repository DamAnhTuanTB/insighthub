nameOverride: ""
fullnameOverride: ""
namespace: insighthub-dev

serviceAccount:
  name: insighthub

runtime:
  existingSecret: runtime
  configMapName: settings

images:
  web:
    repository: insighthub-web
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  api:
    repository: insighthub-api
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: insighthub-worker
    tag: local
    digest: ""
    pullPolicy: IfNotPresent

config:
  environment: local
  logLevel: INFO
  ragMode: fixture
  llmProvider: fixture
  embeddingProvider: fixture
  embeddingDimension: "1024"
  embeddingRevision: "1"
  llmMaxTokens: "1024"
  providerTimeoutSeconds: "60"

web:
  replicas: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicas: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

localDependencies:
  enabled: true
  databaseInitConfigMap: db-init
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    database: insighthub
    user: insighthub
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 192Mi

ingress:
  enabled: false
  className: nginx
  host: insighthub.local
  tlsSecretName: insighthub-local-tls

# Day 4. Exporters and ServiceMonitors stay optional so Day 3 renders unchanged
# when observability is disabled.
observability:
  enabled: false
  # Namespace running kube-prometheus-stack. NetworkPolicies open the metrics
  # ports to this namespace only.
  monitoringNamespace: monitoring
  serviceMonitor:
    enabled: false
    # Must match the kube-prometheus-stack release so its selector picks these up.
    releaseLabel: kube-prom-stack
    interval: 30s
    scrapeTimeout: 10s
  worker:
    metricsPort: 9101
  exporters:
    enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    postgres:
      image: prometheuscommunity/postgres-exporter:v0.19.0
      digest: "sha256:e8a170b85eab07c75c2b0f3aa2806be5c2fe5bba46fd0336914e1f36572cde08"
      port: 9187
    redis:
      image: oliver006/redis_exporter:v1.91.1
      digest: "sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836"
      port: 9121
      # ARQ's pending-job sorted set. Exported as redis_key_size{key="arq:queue"}.
      checkKeys: "arq:queue"
    blackbox:
      image: prom/blackbox-exporter:v0.28.0
      digest: "sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc"
      port: 9115
