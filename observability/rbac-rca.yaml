# Day 4 RCA access for the Kubernetes MCP backend.
#
# The Day 2 ServiceAccount is bound to the `insighthub` namespace only. Day 4
# runs the application in `insighthub-dev`, so the agent needs read access there
# to correlate metrics against pod state. This adds a second namespace-scoped
# RoleBinding to the same read-only ClusterRole: no new verbs, no cluster-wide
# read, and no access to Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-readonly-day4
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/component: observability
subjects:
  - kind: ServiceAccount
    name: mcp-readonly
    namespace: insighthub
roleRef:
  kind: ClusterRole
  name: mcp-readonly
  apiGroup: rbac.authorization.k8s.io
