# Day 4 recording and anomaly rules for InsightHub.
#
# Plain Prometheus rule groups: this file is what promtool validates and what
# evidence/day4.json submits. scripts/day4/render-prometheusrule.py wraps the
# same content into the PrometheusRule CRD applied to the cluster, so the file
# under test and the rules running in Prometheus never drift apart.
#
# Anomaly bands are statistical (mean + 3*stddev over a one hour baseline), not
# machine learning. They are only meaningful once that baseline has actually
# accumulated; a shorter window reports noise as anomaly.
groups:
  - name: insighthub.recording
    interval: 30s
    rules:
      # RED: rate
      - record: insighthub:http_requests:rate5m
        expr: sum by (endpoint) (rate(insighthub_http_requests_total[5m]))

      # RED: errors. clamp_min keeps the ratio defined while traffic is zero.
      - record: insighthub:http_error_ratio:5m
        expr: |
          (sum(rate(insighthub_http_requests_total{status=~"5.."}[5m])) or vector(0))
          / clamp_min(sum(rate(insighthub_http_requests_total[5m])) or vector(0.000001), 0.000001)

      # RED: duration
      # A quantile over zero traffic is NaN, and NaN propagates through
      # avg_over_time, poisoning the whole baseline. Drop the series instead:
      # avg_over_time simply skips timestamps where no sample exists.
      - record: insighthub:rag_latency_p95:5m
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(insighthub_rag_query_latency_seconds_bucket[5m])))
          and on() (sum(rate(insighthub_rag_query_latency_seconds_count[5m])) > 0)

      - record: insighthub:llm_latency_p95:5m
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(insighthub_llm_call_latency_seconds_bucket[5m])))
          and on() (sum(rate(insighthub_llm_call_latency_seconds_count[5m])) > 0)

      # Saturation of the ingestion pipeline.
      # Read from Redis first: the worker's own gauge disappears exactly when the
      # worker is the problem, which would hide the backlog instead of showing it.
      - record: insighthub:queue_depth:current
        expr: |
          max(
            redis_key_size{key="arq:queue"}
            or insighthub_worker_queue_depth
          )
      - record: insighthub:queue_depth:avg5m
        expr: avg_over_time(insighthub:queue_depth:current[5m])

      - record: insighthub:ingestion_failures:rate5m
        expr: sum(rate(insighthub_worker_jobs_total{outcome=~"failed|retried"}[5m])) or vector(0)

      # Token throughput. Provider-reported and word-estimated counters are kept
      # apart upstream and are only summed here for a single usage panel.
      - record: insighthub:llm_tokens:rate5m
        expr: sum by (direction) (rate(insighthub_llm_tokens_total[5m]))

      - record: insighthub:embedding_tokens:rate5m
        expr: |
          (sum(rate(insighthub_embedding_tokens_total[5m])) or vector(0))
          + (sum(rate(insighthub_embedding_estimated_tokens_total[5m])) or vector(0))

      # Declared unit prices applied to observed token rates. This is a local
      # estimate for the cost panel, never a provider invoice or billing total.
      - record: insighthub:estimated_token_cost_usd:rate5m
        expr: |
          (sum(rate(insighthub_llm_tokens_total{direction="input"}[5m])) or vector(0)) * 0.000003
          + (sum(rate(insighthub_llm_tokens_total{direction="output"}[5m])) or vector(0)) * 0.000015
          + (
              (sum(rate(insighthub_embedding_tokens_total[5m])) or vector(0))
              + (sum(rate(insighthub_embedding_estimated_tokens_total[5m])) or vector(0))
            ) * 0.00000002

  - name: insighthub.baseline
    interval: 1m
    # The one hour window is offset by 10 minutes: a firing incident must
    # not be allowed to inflate the band it is being measured against.
    rules:
      - record: insighthub:llm_latency_p95:baseline_mean_1h
        expr: avg_over_time(insighthub:llm_latency_p95:5m[1h] offset 10m)
      - record: insighthub:llm_latency_p95:baseline_stddev_1h
        expr: stddev_over_time(insighthub:llm_latency_p95:5m[1h] offset 10m)
      - record: insighthub:llm_latency_p95:anomaly_upper
        expr: |
          insighthub:llm_latency_p95:baseline_mean_1h
          + 3 * insighthub:llm_latency_p95:baseline_stddev_1h

      - record: insighthub:queue_depth:baseline_mean_1h
        expr: avg_over_time(insighthub:queue_depth:avg5m[1h] offset 10m)
      - record: insighthub:queue_depth:baseline_stddev_1h
        expr: stddev_over_time(insighthub:queue_depth:avg5m[1h] offset 10m)
      - record: insighthub:queue_depth:anomaly_upper
        expr: |
          insighthub:queue_depth:baseline_mean_1h
          + 3 * insighthub:queue_depth:baseline_stddev_1h

      - record: insighthub:http_error_ratio:baseline_mean_1h
        expr: avg_over_time(insighthub:http_error_ratio:5m[1h] offset 10m)
      - record: insighthub:http_error_ratio:baseline_stddev_1h
        expr: stddev_over_time(insighthub:http_error_ratio:5m[1h] offset 10m)
      - record: insighthub:http_error_ratio:anomaly_upper
        expr: |
          insighthub:http_error_ratio:baseline_mean_1h
          + 3 * insighthub:http_error_ratio:baseline_stddev_1h

  - name: insighthub.alerts
    interval: 30s
    rules:
      # for: 2m is longer than the 30s scrape interval, which stops a single
      # slow scrape from flapping the alert.
      - alert: LLMLatencyAnomaly
        expr: |
          insighthub:llm_latency_p95:5m > insighthub:llm_latency_p95:anomaly_upper
          and insighthub:llm_latency_p95:5m > 0.5
        for: 2m
        labels:
          severity: warning
          component: api
          signal: latency
        annotations:
          summary: LLM call p95 latency is above its one hour anomaly band
          value: "{{ $value }}"
          runbook_url: https://github.com/DamAnhTuanTB/insighthub/blob/main/observability/RUNBOOK.md#llmlatencyanomaly

      - alert: IngestionQueueBacklogAnomaly
        expr: |
          insighthub:queue_depth:avg5m > insighthub:queue_depth:anomaly_upper
          and insighthub:queue_depth:avg5m > 5
        for: 2m
        labels:
          severity: warning
          component: ingestion-worker
          signal: saturation
        annotations:
          summary: ARQ queue depth is above its one hour anomaly band
          value: "{{ $value }}"
          runbook_url: https://github.com/DamAnhTuanTB/insighthub/blob/main/observability/RUNBOOK.md#ingestionqueuebackloganomaly

      - alert: APIErrorRateAnomaly
        expr: |
          insighthub:http_error_ratio:5m > insighthub:http_error_ratio:anomaly_upper
          and insighthub:http_error_ratio:5m > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
          signal: errors
        annotations:
          summary: API 5xx ratio is above its one hour anomaly band
          value: "{{ $value }}"
          runbook_url: https://github.com/DamAnhTuanTB/insighthub/blob/main/observability/RUNBOOK.md#apierrorrateanomaly
