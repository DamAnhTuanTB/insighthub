# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: InsightHub fixed Day 6 initial/final comparison

prompts:
  - "{{input}}"

providers:
  - id: http
    label: day6-live-target
    config:
      url: "{{env.DAY6_TARGET_URL}}/v1/chat/completions"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{env.DAY6_API_KEY}}"
      body:
        model: insighthub-chat
        messages:
          - role: user
            content: "{{prompt}}"
        max_tokens: 64
      transformResponse: json.choices[0].message.content

tests: file://datasets/promptfoo-tests.json

evaluateOptions:
  maxConcurrency: 1
