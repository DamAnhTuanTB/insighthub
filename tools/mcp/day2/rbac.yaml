apiVersion: v1
kind: Namespace
metadata:
  name: insighthub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-readonly
  namespace: insighthub
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
# Bind the reusable ClusterRole only within the lab namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-readonly
  namespace: insighthub
subjects:
  - kind: ServiceAccount
    name: mcp-readonly
    namespace: insighthub
roleRef:
  kind: ClusterRole
  name: mcp-readonly
  apiGroup: rbac.authorization.k8s.io
